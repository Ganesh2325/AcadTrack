{% load acadtrack_tags %}
{% if page_obj.paginator.num_pages > 1 %}
<nav class="pagination-bar" aria-label="Pagination">
  {% if page_obj.has_previous %}
    <a class="btn btn-outline-secondary btn-sm" href="{% querystring page=page_obj.previous_page_number %}">Previous</a>
  {% else %}
    <span class="btn btn-outline-secondary btn-sm disabled">Previous</span>
  {% endif %}
  <span class="page-indicator">Page {{ page_obj.number }} of {{ page_obj.paginator.num_pages }}</span>
  {% if page_obj.has_next %}
    <a class="btn btn-outline-secondary btn-sm" href="{% querystring page=page_obj.next_page_number %}">Next</a>
  {% else %}
    <span class="btn btn-outline-secondary btn-sm disabled">Next</span>
  {% endif %}
</nav>
{% endif %}
